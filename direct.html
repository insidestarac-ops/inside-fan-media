    <!-- SCRIPT GESTION DES SONDAGES -->
    <script>
      function publierSondages() {
          const accueil = document.getElementById("sondageAccueilInput").value.trim();
          const nommes = document.getElementById("sondageNommesInput").value.trim();
          
          let updates = {};
          if (accueil) updates["sondages/accueil"] = accueil;
          if (nommes) updates["sondages/nommes"] = nommes;

          if (Object.keys(updates).length > 0) {
              firebase.database().ref().update(updates)
              .then(() => {
                  alert("✅ Liens des sondages mis à jour avec succès !");
              })
              .catch((error) => {
                  alert("❌ Erreur lors de la mise à jour : " + error.message);
              });
          }
      }

      // Chargement initial des IDs de sondages
      setTimeout(() => {
          firebase.database().ref("sondages").on("value", (snap) => {
              if(snap.exists()) {
                  const data = snap.val();
                  if (data.accueil) document.getElementById("sondageAccueilInput").value = data.accueil;
                  if (data.nommes) document.getElementById("sondageNommesInput").value = data.nommes;
              }
          });
      }, 1000);
    </script>

    <!-- SCRIPT BLINDÉ ET ISOLÉ (Ne dépend pas de live.js) -->
    <script>
      // 1. Upload Magique
      document.getElementById('fileUploadNommes').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const progress = document.getElementById('uploadProgressNommes');
        const input = document.getElementById('afficheNommesInput');
        progress.textContent = "⏳ Hébergement de l'image en cours...";
        progress.style.color = "#fff";

        const formData = new FormData();
        formData.append("image", file);

        try {
            // J'ai mis ta clé API ImgBB en dur pour être sûr que ça marche
            const response = await fetch(`https://api.imgbb.com/1/upload?key=c0dc37036ae1706a4820e4f9e9d271f4`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                input.value = data.data.url;
                progress.textContent = "✅ Image prête ! Tu peux cliquer sur Publier.";
                progress.style.color = "#25D366";
            } else {
                throw new Error("Erreur serveur ImgBB");
            }
        } catch (error) {
            progress.textContent = "❌ Échec de l'envoi. Vérifie ta connexion.";
            progress.style.color = "#FF4757";
        }
      });

      // 2. Publication sur le site
      function publierAfficheUrgente() {
          const url = document.getElementById("afficheNommesInput").value.trim();
          if (url === "") {
              alert("❌ Veuillez d'abord cliquer sur le dossier 📁 pour ajouter une image !");
              return;
          }
          
          // On appelle firebase explicitement
          firebase.database().ref("nommes/affiche").set(url)
          .then(() => {
              alert("✅ L'affiche des nommés a été mise à jour avec succès !");
              document.getElementById('uploadProgressNommes').textContent = "";
          })
          .catch((error) => {
              alert("❌ Erreur de connexion : " + error.message);
          });
      }

      // 3. Voir l'image en ligne au chargement
      setTimeout(() => {
          firebase.database().ref("nommes/affiche").on("value", (snap) => {
              if(snap.exists()) {
                  document.getElementById("afficheNommesInput").value = snap.val();
              }
          });
      }, 1000);
    </script>
    <!-- FIN DE L'ENCART -->
